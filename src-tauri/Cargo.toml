[package]
name = "knotra-desktop"
version = "0.1.0"
description = "Knotra pipeline workspace"
authors = ["Knotra contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "knotra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
base64 = "0.22"
unicode-normalization = "0.1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
tokio = { version = "1", features = ["time", "sync", "net"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
